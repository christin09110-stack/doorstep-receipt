<!doctype html><html><head><meta charset="utf-8"><style>
body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 28px; color: #1c1c1c; }
.card { background: #fff; max-width: 620px; margin: 0 auto; padding: 26px 30px 20px;
        border: 1px solid #dcdcdc; border-radius: 8px; }
.brand { font-weight: 700; font-size: 20px; color: #cc092f; letter-spacing: -0.01em; }
.num { font-family: ui-monospace, Menlo, monospace; font-size: 15px; color: #444; margin: 10px 0 20px; }
.status { font-size: 24px; font-weight: 700; margin: 0 0 6px; color: #b3401f; }
.when { font-size: 15px; color: #333; margin: 0 0 18px; }
.detail { font-size: 14px; color: #555; border-top: 1px solid #eee; padding-top: 12px; }
.detail div { margin-bottom: 5px; }
.sample { max-width: 620px; margin: 14px auto 0; font-size: 11px; color: #777; text-align: center; }
</style></head><body>
<div class="card">
  <div class="brand">Royal Mail Track &amp; Trace</div>
  <div class="num">Your reference: RM123456789GB</div>
  <div class="status">We attempted to deliver your item</div>
  <div class="when">20 September 2026 at 14:11</div>
  <div class="detail"><div>Delivery office: Sheffield DO</div><div>A card was left at the address.</div></div>
</div>
<p class="sample">Sample page written for the Doorstep Receipt test suite. Not a real carrier page.</p>
</body></html>
