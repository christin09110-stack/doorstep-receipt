<!doctype html><html><head><meta charset="utf-8"><style>
body { font-family: 'Amazon Ember', Arial, sans-serif; background: #eaeded; margin: 0; padding: 28px; color: #1c1c1c; }
.card { background: #fff; max-width: 620px; margin: 0 auto; padding: 26px 30px 20px;
        border: 1px solid #dcdcdc; border-radius: 8px; }
.brand { font-weight: 700; font-size: 20px; color: #232f3e; letter-spacing: -0.01em; }
.num { font-family: ui-monospace, Menlo, monospace; font-size: 15px; color: #444; margin: 10px 0 20px; }
.status { font-size: 24px; font-weight: 700; margin: 0 0 6px; color: #067d62; }
.when { font-size: 15px; color: #333; margin: 0 0 18px; }
.detail { font-size: 14px; color: #555; border-top: 1px solid #eee; padding-top: 12px; }
.detail div { margin-bottom: 5px; }
.sample { max-width: 620px; margin: 14px auto 0; font-size: 11px; color: #777; text-align: center; }
</style></head><body>
<div class="card">
  <div class="brand">Amazon Logistics</div>
  <div class="num">Tracking ID: TBA305012345678</div>
  <div class="status">Delivered to safe place</div>
  <div class="when">Sunday 20 September 2026, 14:11</div>
  <div class="detail"><div>Left in: Porch</div><div>Order # 203-5512099-1180213</div></div>
</div>
<p class="sample">Sample page written for the Doorstep Receipt test suite. Not a real carrier page.</p>
</body></html>
